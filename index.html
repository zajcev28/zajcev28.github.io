<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matematyczne Bomby</title>

    <!-- Manifest PWA -->
    <link rel="manifest" href="manifest.json">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e7f3ff;
            text-align: center;
            padding: 20px;
        }

        #gameContainer {
            margin: 0 auto;
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        #task {
            font-size: 32px;
            margin: 20px 0;
        }

        #timer {
            font-size: 22px;
            font-weight: bold;
            margin: 10px;
            color: #003f8a;
        }

        #result {
            font-size: 20px;
            margin: 15px;
            min-height: 25px;
        }

        input {
            font-size: 22px;
            padding: 10px;
            width: 120px;
            text-align: center;
            margin-bottom: 15px;
        }

        button {
            padding: 12px 25px;
            background: #0077ff;
            color: white;
            border: none;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #005fcc;
        }

        canvas {
            margin-top: 20px;
            background: transparent;
        }
    </style>
</head>

<body>
    <h1>💣 Matematyczne Bomby</h1>

    <div id="gameContainer">
        <button id="startBtn">START</button>

        <div id="task">Kliknij START</div>

        <input type="number" id="answerInput" placeholder="?" />

        <div id="timer"></div>

        <div id="result"></div>

        <canvas id="gameCanvas" width="300" height="200"></canvas>
    </div>

    <!-- Service Worker -->
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js")
                .catch(err => console.log("SW error:", err));
        }
    </script>

    <!-- GRA -->
    <script src="game.js"></script>

</body>
</html>
