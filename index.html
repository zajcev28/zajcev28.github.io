<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matematyczne Bomby – Daniel</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: #eef3ff;
        }

        #game box {
            margin-top: 20px;
        }

        #task {
            font-size: 2em;
            margin: 20px 0;
            font-weight: bold;
        }

        #answer {
            padding: 10px;
            font-size: 1.4em;
            width: 120px;
            text-align: center;
        }

        #result {
            margin-top: 15px;
            font-size: 1.3em;
            height: 28px;
        }

        #animationBox {
            margin: 20px auto;
            width: 40px;
            height: 40px;
            background: red;
            border-radius: 8px;
        }

        .shake {
            animation: shake 0.3s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
            100% { transform: translateX(0); }
        }

        #timer {
            font-size: 1.6em;
            margin: 10px 0;
        }

        button {
            padding: 10px 18px;
            font-size: 1.2em;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 8px;
            margin: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #005fcc;
        }

    </style>
</head>
<body>

    <h1>Witaj, Daniel! 👋</h1>
    <p>Rozwiąż 15 przykładów z mnożenia zanim skończy się czas!</p>

    <!-- TIMER -->
    <div id="timer">10s</div>

    <!-- ZADANIE MATEMATYCZNE -->
    <div id="task">Kliknij Start</div>

    <!-- WYNIK UŻYTKOWNIKA -->
    <input id="answer" type="number" placeholder="?" autocomplete="off" />

    <!-- KOMUNIKATY -->
    <div id="result"></div>

    <!-- ANIMACJA (czerwony kwadrat jeżdżący) -->
    <div id="animationBox"></div>

    <!-- PRZYCISKI -->
    <button id="startBtn">Start</button>
    <button id="micBtn">🎤 Mikrofon</button>

    <!-- SKRYPT GRY -->
    <script src="game.js"></script>

</body>
</html>
